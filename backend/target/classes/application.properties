# Application name
spring.application.name=timefighter

# Server port
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:timefighterdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.example.timefighter=DEBUG

# JWT Configuration
# Secret key (should be overridden in production)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiration time in milliseconds (10 hours)
jwt.expiration=36000000